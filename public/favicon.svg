<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="faleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A29" />
      <stop offset="100%" stop-color="#E8480C" />
    </linearGradient>
    <filter id="faleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#7A1D00" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Tilted squircle badge matching FALE Logo (-4deg tilt) -->
  <g transform="rotate(-4 32 32)">
    <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#faleGrad)" />
  </g>

  <!-- Stylized Fraunces italic 'f' with crossbar and droplet terminal -->
  <g filter="url(#faleShadow)">
    <text
      x="33"
      y="47"
      font-family="'Fraunces', 'Georgia', 'Times New Roman', serif"
      font-size="44"
      font-weight="900"
      font-style="italic"
      fill="#FFFFFF"
      text-anchor="middle"
    >f</text>
  </g>
</svg>